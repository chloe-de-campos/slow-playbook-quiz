<title>Slow Playbook Quiz</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Karla:wght@400;500;700&display=swap');

:root{
  --bg:#eef1e9;
  --bg-raise:#ffffff;
  --field:#d8e3d2;
  --field-line:#8fae87;
  --ink:#22301f;
  --ink-soft:#5c6b57;
  --accent:#e0622c;
  --accent-ink:#ffffff;
  --defender:#b98a2e;
  --good:#3f7d4d;
  --bad:#b23a6e;
  --card-border:#d3dbc9;
  --shadow:0 1px 2px rgba(34,48,31,0.06), 0 8px 24px -12px rgba(34,48,31,0.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151c14;
    --bg-raise:#1d2619;
    --field:#22301f;
    --field-line:#4a6142;
    --ink:#eef1e9;
    --ink-soft:#a6b39e;
    --accent:#f07940;
    --accent-ink:#1a1207;
    --defender:#d9a94a;
    --good:#5fae72;
    --bad:#e2649a;
    --card-border:#33422d;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --bg:#151c14;
  --bg-raise:#1d2619;
  --field:#22301f;
  --field-line:#4a6142;
  --ink:#eef1e9;
  --ink-soft:#a6b39e;
  --accent:#f07940;
  --accent-ink:#1a1207;
  --defender:#d9a94a;
  --good:#5fae72;
  --bad:#e2649a;
  --card-border:#33422d;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}

*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Karla',system-ui,sans-serif;
  min-height:100vh;
}
.wrap{
  max-width:520px;
  margin:0 auto;
  padding:12px 16px 40px;
}
.masthead{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:12px;
  gap:12px;
}
.masthead h1{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:28px;
  letter-spacing:0.01em;
  margin:0;
  text-wrap:balance;
}
.masthead .tag{
  font-size:12px;
  color:var(--ink-soft);
  font-weight:500;
}
.disclaimer{
  position:relative;
  background:color-mix(in srgb, var(--defender) 14%, var(--bg-raise));
  border:1px solid color-mix(in srgb, var(--defender) 35%, var(--card-border));
  border-radius:12px;
  padding:10px 42px 10px 14px;
  font-size:12.5px;
  line-height:1.5;
  color:var(--ink-soft);
  margin-bottom:14px;
}
.disclaimer.hide{display:none;}
.disclaimer b{
  color:var(--ink);
}
.disclaimer a{
  color:var(--ink);
  font-weight:700;
  text-decoration:underline;
  text-underline-offset:2px;
}
.disclaimer-close{
  position:absolute;
  top:4px;
  right:4px;
  width:38px;
  height:38px;
  border:none;
  background:transparent;
  color:var(--ink-soft);
  font-size:16px;
  line-height:1;
  cursor:pointer;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.disclaimer-close:hover{background:color-mix(in srgb, var(--defender) 22%, transparent);color:var(--ink);}
.progress-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.progress-track{
  flex:1;
  height:6px;
  border-radius:999px;
  background:var(--field-line);
  opacity:0.35;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:var(--accent);
  border-radius:999px;
  transition:width 0.35s ease;
}
.progress-label{
  font-size:12px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.score-chip{
  font-size:12px;
  font-weight:700;
  color:var(--good);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.card{
  background:var(--bg-raise);
  border:1px solid var(--card-border);
  border-radius:16px;
  box-shadow:var(--shadow);
  overflow:hidden;
  margin-bottom:10px;
  opacity:1;
  transform:translateX(0);
  transition:opacity 0.22s ease, transform 0.22s ease;
}
.card.card-enter{
  opacity:0;
  transform:translateX(18px);
}
.card.card-enter.enter-back{
  transform:translateX(-18px);
}
.card-head{
  padding:12px 18px 8px;
}
.section-label{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:13px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 4px;
}
.prompt{
  font-size:17px;
  font-weight:700;
  line-height:1.35;
  margin:0;
  text-wrap:balance;
}
.prompt .callname{
  color:var(--accent);
}

.field-frame{
  padding:4px 14px 8px;
  position:relative;
}
.field-svg{
  width:100%;
  height:auto;
  display:block;
  border-radius:10px;
  background:var(--field);
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
.field-svg.drawable{cursor:crosshair;}

.start-hint-path{
  pointer-events:none;
  fill:none;
  stroke:var(--accent);
  stroke-width:1.4;
  stroke-linecap:round;
  stroke-dasharray:2.2,2.6;
  opacity:0.6;
  animation:startHintMarch 0.9s linear infinite;
}
@keyframes startHintMarch{
  from{stroke-dashoffset:0;}
  to{stroke-dashoffset:-4.8;}
}

.draw-actions{
  display:flex;
  gap:10px;
  padding:2px 18px 6px;
}
.draw-actions button{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:14px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  border-radius:11px;
  padding:12px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.clear-btn{
  flex:none;
  width:96px;
  background:transparent;
  border:1.5px solid var(--card-border);
  color:var(--ink-soft);
}
.clear-btn:disabled{opacity:0.4;cursor:default;}
.check-btn{
  flex:1;
  background:var(--accent);
  color:var(--accent-ink);
  border:none;
}
.check-btn:disabled{opacity:0.4;cursor:default;}

.result-banner{
  margin:2px 18px 0;
  padding:8px 14px;
  border-radius:10px;
  font-weight:700;
  font-size:14px;
  display:none;
  opacity:0;
  transform:translateY(6px);
  transition:opacity 0.2s ease, transform 0.2s ease;
}
.result-banner.show{display:block;}
.result-banner.show.in{opacity:1;transform:translateY(0);}
.result-banner.good{background:color-mix(in srgb, var(--good) 16%, var(--bg-raise));color:var(--good);}
.result-banner.bad{background:color-mix(in srgb, var(--bad) 16%, var(--bg-raise));color:var(--bad);}

.inline-next-btn{
  display:none;
  width:calc(100% - 36px);
  margin:12px 18px 18px;
  background:var(--accent);
  color:var(--accent-ink);
  border:none;
  border-radius:11px;
  padding:11px;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:14px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  cursor:pointer;
  opacity:0;
  transform:translateY(6px);
  transition:opacity 0.2s ease, transform 0.2s ease;
}
.inline-next-btn.show{display:block;}
.inline-next-btn.show.in{opacity:1;transform:translateY(0);}

.explain{
  margin:10px 18px 18px;
  padding:12px 14px;
  border-radius:10px;
  background:var(--field);
  font-size:13.5px;
  line-height:1.5;
  color:var(--ink);
  display:none;
  opacity:0;
  transform:translateY(6px);
  transition:opacity 0.2s ease, transform 0.2s ease;
}
.explain.show{display:block;}
.explain.show.in{opacity:1;transform:translateY(0);}
.explain b{color:var(--accent);}

.nav-row{
  display:flex;
  flex:none;
  gap:6px;
}
.nav-arrow{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--bg-raise);
  border:1.5px solid var(--card-border);

  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;

.nav-arrow:disabled{opacity:0.35;cursor:default;}
.nav-arrow:last-child{

  color:var(--accent-ink);
}

  text-align:center;

}
.results h2{
  font-family:'Barlow Condensed',sans-serif;

}
.results .big-score{

  font-weight:700;

.results p{

  border:1.5px solid var(--accent);

  border-radius:11px;
  padding:11px 18px;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:14px;
  letter-spacing:0.03em;
  text-transform:uppercase;

.field-key{

.field-key i{

}
.field-key i.you-key{

}
.field-key .mark-key{

<script>
(function(){

// ---------- field diagram helpers ----------
// coordinate system: 0-100 wide (sideline to sideline), 0-140 tall.
// y=0 is downfield / attacking direction, y=140 is backfield (near disc origin).
var VB_W = 100, VB_H = 140;

function svgOpenTag(minY, cropH){
  minY = minY || 0;
  cropH = cropH || VB_H;
  return '<svg class="field-svg" data-vbw="'+VB_W+'" data-vbh="'+cropH+'" data-vby="'+minY+'" viewBox="0 '+minY+' '+VB_W+' '+cropH+'" xmlns="http://www.w3.org/2000/svg">';
}
function player(x,y,lbl,fill,stroke,r){
  r = r||4.2;
  return '<g>'
    + '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="'+(stroke||'none')+'" stroke-width="1"/>'
    + (lbl ? '<text x="'+x+'" y="'+(y+1.5)+'" font-size="4.4" font-weight="700" text-anchor="middle" fill="var(--bg-raise)" font-family="Barlow Condensed, sans-serif">'+lbl+'</text>' : '')
    + '</g>';
}
function you(x,y,lbl){
  return '<g>'
    + '<circle cx="'+x+'" cy="'+y+'" r="6.2" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="1.6,1.4"/>'
    + player(x,y,lbl||'Y','var(--accent)')
    + '</g>';
}
function markX(x,y){
  return '<text x="'+x+'" y="'+(y+2.6)+'" font-size="7.5" font-weight="700" text-anchor="middle" fill="var(--defender)">X</text>';
}
function disc(x,y){
  return '<circle cx="'+x+'" cy="'+y+'" r="2.4" fill="none" stroke="var(--ink)" stroke-width="1.1"/>'
    + '<circle cx="'+x+'" cy="'+y+'" r="0.9" fill="var(--ink)"/>';
}
function sidelineLine(x){
  return '<line x1="'+x+'" y1="0" x2="'+x+'" y2="140" stroke="var(--field-line)" stroke-width="0.6" opacity="0.7"/>';
}
// Figure out the vertical slice of the 0-140 field this play actually uses (players,
// discs, marks, and the ideal answer arrow's reach), then crop the SVG's viewBox to
// just that slice plus a little padding — this trims empty field above/below the
// play without touching any of the underlying x/y coordinates.
function playYBounds(play){
  var minY = Infinity, maxY = -Infinity;
  function consider(y){ if(y<minY) minY=y; if(y>maxY) maxY=y; }
  play.players.forEach(function(p){ consider(p.y); });
  play.discs.forEach(function(d){ consider(d.y); });
  play.marks.forEach(function(m){ consider(m.y); });
  if(play.startPoint) consider(play.startPoint.y);
  // Include where the ideal cut actually ends, so there's real room to draw it —
  // not a flat guess at how deep a cut might go.
  if(play.startPoint && typeof play.idealAngle === 'number'){
    var idealDist = Math.max(20, play.minDist + 6);
    var iaRad = play.idealAngle * Math.PI/180;
    var iEndY = play.startPoint.y - Math.sin(iaRad)*idealDist;
    consider(iEndY);
  }
  if(minY === Infinity){ minY = 0; maxY = VB_H; }
  // Fixed pad on both ends so dots/arrows have breathing room and aren't flush
  // against the edge.
  var topPad = 24;
  var bottomPad = 18;
  minY = Math.max(0, minY - topPad);
  maxY = Math.min(VB_H, maxY + bottomPad);
  return {minY: minY, maxY: maxY};
}

function buildSetupSvg(play){
  var b = playYBounds(play);
  var cropH = b.maxY - b.minY;
  var parts = [svgOpenTag(b.minY, cropH)];
  play.sidelines.forEach(function(sl){ parts.push(sidelineLine(sl.x)); });
  play.discs.forEach(function(d){ parts.push(disc(d.x, d.y)); });
  play.marks.forEach(function(m){ parts.push(markX(m.x, m.y)); });
  play.players.forEach(function(p){
    if(p.kind === 'you'){
      parts.push(you(p.x, p.y, p.label || 'Y'));
    } else {
      parts.push(player(p.x, p.y, p.label || '', 'var(--field-line)', 'var(--card-border)'));
    }
  });
  parts.push('</svg>');
  return parts.join('');
}

// ---------- direction-based grading ----------
// Grade a drawn path by comparing its overall direction (start->end vector) against
// an ideal direction (derived from the actual answer path drawn in the editor),
// with an angle tolerance, plus a minimum travel distance.
function angleOf(dx,dy){
  return Math.atan2(-dy, dx) * 180 / Math.PI;
}
function angleDiff(a,b){
  var d = Math.abs(a-b) % 360;
  return d > 180 ? 360-d : d;
}
function gradeDirection(idealAngle, minDist, tolerance){
  tolerance = tolerance || 32;
  return function(pts){
    // Grade from the path's actual first point (where the player really put their
    // finger down) to its actual last point — not from the "ideal" start location —
    // so the graded vector always matches what was visually drawn.
    var start = pts[0];
    var end = pts[pts.length-1];
    var dx = end.x - start.x;
    var dy = end.y - start.y;
    var dist = Math.sqrt(dx*dx+dy*dy);
    if(dist < minDist) return false;
    var ang = angleOf(dx,dy);
    return angleDiff(ang, idealAngle) <= tolerance;
  };
}

// Some cuts are genuinely two-part — a fake one way, then a hard break the other way
// (a V-cut). Collapsing that into one start->end vector nets the two legs into a
// single misleading average that represents neither. Instead, find the sharpest bend
// in the drawn path (the point farthest from the straight line between its start and
// end) and grade each side of that bend against its own ideal leg, in order.
function pathElbow(pts){
  var a = pts[0], b = pts[pts.length-1];
  var dx = b.x-a.x, dy = b.y-a.y;
  var len = Math.sqrt(dx*dx+dy*dy) || 1;
  var bestI = 0, bestD = -1;
  for(var i=0;i<pts.length;i++){
    var d = Math.abs((pts[i].y-a.y)*dx - (pts[i].x-a.x)*dy)/len;
    if(d > bestD){ bestD = d; bestI = i; }
  }
  return bestI;
}
// Two-leg grading runs two independent angle+distance checks instead of one, and a
// hand-drawn corner is rounded rather than sharp — the elbow-detection below lands
// close to but not exactly on the original bend, which skews both legs' measured
// angle/distance a bit. A single-vector tolerance (32°) is too strict once you're
// running that check twice, so legs get a wider tolerance and a discount on the
// required distance per leg to absorb that rounding.
function gradeLegs(legs, tolerance){
  tolerance = tolerance || 44;
  return function(pts){
    if(pts.length < 4) return false;
    var elbowI = pathElbow(pts);
    if(elbowI <= 0 || elbowI >= pts.length-1) return false;
    var leg1 = pts.slice(0, elbowI+1);
    var leg2 = pts.slice(elbowI);
    function legOk(legPts, leg){
      var start = legPts[0], end = legPts[legPts.length-1];
      var dx = end.x-start.x, dy = end.y-start.y;
      var dist = Math.sqrt(dx*dx+dy*dy);
      if(dist < leg.minDist*0.7) return false;
      return angleDiff(angleOf(dx,dy), leg.angle) <= tolerance;
    }
    return legOk(leg1, legs[0]) && legOk(leg2, legs[1]);
  };

  });
}

// Question cards start in the .card-enter (offset/transparent) state and settle into
// the default .card state one frame later. Slides in from the right on Next, from the
// left on Prev, so the arrow the user just clicked matches the direction things move.
var lastNavDirection = 1; // 1 = forward (Next), -1 = backward (Prev)
function animateCardIn(cardEl){
  if(!cardEl || reduceMotion) return;
  cardEl.classList.add('card-enter');
  if(lastNavDirection < 0) cardEl.classList.add('enter-back');
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ cardEl.classList.remove('card-enter', 'enter-back'); });
  });
}

// ---------- quiz engine ----------
var current = 0;
var scoreCount = 0;
var picks = []; // {qIndex, correct}

var host = document.getElementById('question-host');
var scoreChip = document.getElementById('score-chip');
var progFill = document.getElementById('progress-fill');
var progLabel = document.getElementById('progress-label');
var quizArea = document.getElementById('quiz-area');
var resultsArea = document.getElementById('results-area');
var prevBtn = document.getElementById('prev-btn');
var nextBtn = document.getElementById('next-btn');
prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);

function renderQuestion(){
  var q = Q[current];
  progLabel.textContent = (current+1) + ' / ' + Q.length;
  progFill.style.width = (current/Q.length*100) + '%';
  scoreChip.textContent = scoreCount + ' correct';
  prevBtn.disabled = (current === 0);
  nextBtn.setAttribute('aria-label', current === Q.length - 1 ? 'See results' : 'Next play');

  if(q.type === 'draw'){
    renderDrawQuestion(q);
  } else {
    renderMcQuestion(q);
  }
}

function renderMcQuestion(q){
  var html = '<div class="card">';
  html += '<div class="card-head"><p class="section-label">'+q.section+'</p><p class="prompt">'+q.prompt+'</p></div>';
  html += '<div class="options" id="opts"></div>';
  html += '<div class="explain" id="explain"></div>';
  html += '<button class="inline-next-btn" id="inline-next-btn"></button>';
  html += '</div>';
  host.innerHTML = html;
  document.getElementById('inline-next-btn').addEventListener('click', goNext);
  animateCardIn(host.querySelector('.card'));

  var optsHost = document.getElementById('opts');
  optsHost.className = 'field-key';
  optsHost.style.cssText = 'display:flex;flex-direction:column;gap:10px;padding:4px 18px 18px;';
  q.options.forEach(function(opt, i){
    var btn = document.createElement('button');
    btn.className = 'opt';
    btn.style.cssText = 'text-align:left;border:1.5px solid var(--card-border);background:var(--bg-raise);color:var(--ink);border-radius:11px;padding:12px 14px;font-family:Karla,sans-serif;font-size:14.5px;font-weight:500;line-height:1.4;cursor:pointer;transition:background-color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;';
    btn.innerHTML = opt.t;
    btn.addEventListener('click', function(){ chooseMc(i); });
    optsHost.appendChild(btn);
  });
}

function chooseMc(i){
  var q = Q[current];
  var buttons = document.querySelectorAll('#opts button');
  var correctIdx = q.options.findIndex(function(o){return o.c;});
  var wasCorrect = (i === correctIdx);

  buttons.forEach(function(b, idx){
    b.disabled = true;
    var apply = function(){
      if(idx === correctIdx){ b.style.borderColor='var(--good)'; b.style.background='color-mix(in srgb, var(--good) 14%, var(--bg-raise))'; b.innerHTML = '<span style="font-weight:700;margin-right:6px;">✓</span>' + b.innerHTML; if(idx===i) b.style.transform='scale(1.015)'; }
      else if(idx === i){ b.style.borderColor='var(--bad)'; b.style.background='color-mix(in srgb, var(--bad) 14%, var(--bg-raise))'; b.innerHTML = '<span style="font-weight:700;margin-right:6px;">✗</span>' + b.innerHTML; }
    };
    if(idx !== correctIdx && idx !== i) return;
    if(reduceMotion) apply();
    else setTimeout(apply, idx * 40);
  });

  finishQuestion(wasCorrect, null);
}

// ---------- draw-the-cut question ----------
function renderDrawQuestion(q){
  var html = '<div class="card">';
  html += '<div class="card-head"><p class="section-label">'+q.section+'</p>';
  html += '<p class="prompt">'+q.prompt+'</p></div>';
  html += '<div class="field-frame"><div id="draw-host">'+q.setup+'</div></div>';
  html += '<div class="field-key"><span><i class="you-key"></i>Y, for you</span><span><i style="background:var(--field-line)"></i>teammates</span><span class="mark-key">X&nbsp;Mark</span><span><svg class="disc-key" viewBox="0 0 10 10" width="10" height="10"><circle cx="5" cy="5" r="3.6" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="5" cy="5" r="1.4" fill="var(--ink)"/></svg>disc</span></div>';
  html += '<div class="draw-actions"><button class="clear-btn" id="clear-btn" disabled>Clear</button><button class="check-btn" id="check-btn" disabled>Check cut</button></div>';
  html += '<div class="result-banner" id="result-banner"></div>';
  html += '<div class="explain" id="explain"></div>';
  html += '<button class="inline-next-btn" id="inline-next-btn"></button>';
  html += '</div>';
  host.innerHTML = html;
  document.getElementById('inline-next-btn').addEventListener('click', goNext);
  animateCardIn(host.querySelector('.card'));

  var svg = document.querySelector('#draw-host svg');
  svg.classList.add('drawable');
  var pathPts = [];
  var pathEl = null;
  var drawing = false;
  var locked = false;

  // First question only: a marching-dots preview of the actual cut shape, so it's
  // obvious both that the field is drawable and roughly what a cut looks like.
  // Removed on the first touch/click.
  var startHintEls = [];
  if(current === 0){
    var hintFrom = q.startPoint;
    var hintSegs = q.legs
      ? q.legs.map(function(leg){ return {angle: leg.angle, dist: Math.max(leg.minDist, leg.minDist + 4)}; })
      : [{angle: q.idealAngle, dist: q.idealDist}];
    hintSegs.forEach(function(seg){
      var rad = seg.angle * Math.PI/180;
      var ux = Math.cos(rad), uy = -Math.sin(rad);
      var to = {x: hintFrom.x + ux*seg.dist, y: hintFrom.y + uy*seg.dist};
      var hintPath = document.createElementNS('http://www.w3.org/2000/svg','path');
      hintPath.setAttribute('class', 'start-hint-path');
      hintPath.setAttribute('d', 'M '+hintFrom.x.toFixed(2)+' '+hintFrom.y.toFixed(2)+' L '+to.x.toFixed(2)+' '+to.y.toFixed(2));
      if(reduceMotion) hintPath.style.animation = 'none';
      svg.appendChild(hintPath);
      startHintEls.push(hintPath);
      hintFrom = to;
    });
  }
  function clearStartHint(){
    startHintEls.forEach(function(el){ el.remove(); });
    startHintEls = [];
  }

  var checkBtn = document.getElementById('check-btn');
  var clearBtn = document.getElementById('clear-btn');

  function svgPoint(evt){
    var rect = svg.getBoundingClientRect();
    var vbw = parseFloat(svg.getAttribute('data-vbw')) || VB_W;
    var vbh = parseFloat(svg.getAttribute('data-vbh')) || VB_H;
    var vby = parseFloat(svg.getAttribute('data-vby')) || 0;
    var x = (evt.clientX - rect.left) / rect.width * vbw;
    var y = vby + (evt.clientY - rect.top) / rect.height * vbh;
    return {x:x, y:y};
  }

  function distTo(p, sp){
    return Math.sqrt(Math.pow(p.x-sp.x,2) + Math.pow(p.y-sp.y,2));
  }

  function updatePathEl(){
    if(!pathEl) return;
    var d = 'M ' + pathPts.map(function(p){return p.x.toFixed(1)+' '+p.y.toFixed(1);}).join(' L ');
    pathEl.setAttribute('d', d);
  }

  // Trims trailing points that are within a tiny radius of each other (pointerup jitter)
  // and returns a direction vector computed from a point a stable distance back from the
  // true end, rather than the last raw (often noisy) segment — this is what fixes
  // the arrowhead pointing the wrong way on freehand paths.
  function stableEndDirection(pts){
    var end = pts[pts.length-1];
    var lookback = 6; // world units in the 0-100/0-140 viewBox
    for(var i = pts.length-1; i >= 0; i--){
      if(distTo(pts[i], end) >= lookback){
        return {from: pts[i], to: end};
      }
    }
    return {from: pts[0], to: end};
  }

  var activePointerId = null;

  function pointerDown(evt){
    if(locked || drawing) return;
    var p = svgPoint(evt);
    if(distTo(p, q.startPoint) > 14) return;
    clearStartHint();
    drawing = true;
    activePointerId = evt.pointerId;
    // Use the real touch/click point as the path's first point (not the ideal startPoint) —
    // grading below measures from q.startPoint separately, but the drawn + graded path should
    // reflect where the player actually put their finger down.
    pathPts = [p];
    if(pathEl) pathEl.remove();
    pathEl = document.createElementNS('http://www.w3.org/2000/svg','path');
    pathEl.setAttribute('fill','none');
    pathEl.setAttribute('stroke','var(--accent)');
    pathEl.setAttribute('stroke-width','1.6');
    pathEl.setAttribute('stroke-linecap','round');
    pathEl.setAttribute('stroke-linejoin','round');
    svg.appendChild(pathEl);
    updatePathEl();
    svg.setPointerCapture && evt.pointerId!=null && svg.setPointerCapture(evt.pointerId);
    evt.preventDefault();
  }
  function pointerMove(evt){
    if(!drawing || locked) return;
    if(activePointerId!=null && evt.pointerId!=null && evt.pointerId!==activePointerId) return;
    var p = svgPoint(evt);
    pathPts.push(p);
    updatePathEl();
    evt.preventDefault();
  }
  function pointerUp(evt){
    if(!drawing) return;
    if(activePointerId!=null && evt && evt.pointerId!=null && evt.pointerId!==activePointerId) return;
    drawing = false;
    activePointerId = null;
    if(pathPts.length > 1){
      checkBtn.disabled = false;
      clearBtn.disabled = false;
    }
  }

  svg.addEventListener('pointerdown', pointerDown);
  svg.addEventListener('pointermove', pointerMove);
  svg.addEventListener('pointerup', pointerUp);
  svg.addEventListener('pointerleave', pointerUp);
  svg.addEventListener('pointercancel', pointerUp);

  clearBtn.addEventListener('click', function(){
    if(locked) return;
    pathPts = [];
    if(pathEl){ pathEl.remove(); pathEl = null; }
    checkBtn.disabled = true;
    clearBtn.disabled = true;
  });

  checkBtn.addEventListener('click', function(){
    if(locked || pathPts.length < 2) return;
    locked = true;
    checkBtn.disabled = true;
    clearBtn.disabled = true;
    svg.classList.remove('drawable');

    var wasCorrect = q.grade(pathPts);
    var resultColor = wasCorrect ? 'var(--good)' : 'var(--bad)';

    if(pathEl){
      pathEl.setAttribute('stroke', resultColor);
    }

    // Draw a stable, correctly-oriented arrowhead at the true end point, using a
    // direction computed from points spaced apart enough to avoid pointerup jitter.
    var dir = stableEndDirection(pathPts);
    var end = pathPts[pathPts.length-1];
    var dx = dir.to.x - dir.from.x;
    var dy = dir.to.y - dir.from.y;
    var len = Math.sqrt(dx*dx+dy*dy) || 1;
    var ux = dx/len, uy = dy/len;
    var headLen = 3.6, headWidth = 2.2;
    var backX = end.x - ux*headLen, backY = end.y - uy*headLen;
    var perpX = -uy, perpY = ux;
    var p1x = backX + perpX*headWidth, p1y = backY + perpY*headWidth;
    var p2x = backX - perpX*headWidth, p2y = backY - perpY*headWidth;
    var arrowHead = document.createElementNS('http://www.w3.org/2000/svg','path');
    arrowHead.setAttribute('d', 'M '+end.x.toFixed(2)+' '+end.y.toFixed(2)+' L '+p1x.toFixed(2)+' '+p1y.toFixed(2)+' L '+p2x.toFixed(2)+' '+p2y.toFixed(2)+' Z');
    arrowHead.setAttribute('fill', resultColor);
    if(!reduceMotion){
      arrowHead.style.opacity = '0';
      arrowHead.style.transition = 'opacity 0.18s ease';
    }
    svg.appendChild(arrowHead);
    if(!reduceMotion){
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ arrowHead.style.opacity = '1'; }); });
    }

    // When wrong, draw the correct answer directly on the field as a dashed reference
    // path, instead of just describing it in text.
    function drawRefSegment(from, to, withHead){
      var dx = to.x-from.x, dy = to.y-from.y;
      var len = Math.sqrt(dx*dx+dy*dy) || 1;
      var ux = dx/len, uy = dy/len;
      var refLine = document.createElementNS('http://www.w3.org/2000/svg','path');
      refLine.setAttribute('d', 'M '+from.x.toFixed(2)+' '+from.y.toFixed(2)+' L '+to.x.toFixed(2)+' '+to.y.toFixed(2));
      refLine.setAttribute('fill','none');
      refLine.setAttribute('stroke','var(--good)');
      refLine.setAttribute('stroke-width','1.4');
      refLine.setAttribute('stroke-linecap','round');
      svg.appendChild(refLine);
      if(reduceMotion){
        refLine.setAttribute('stroke-dasharray','3,2.4');
      } else {
        // Draw the reference line on as a solid stroke first (dashoffset animating
        // to 0), then swap to the dashed pattern once it's fully drawn.
        var totalLen = refLine.getTotalLength();
        refLine.setAttribute('stroke-dasharray', totalLen);
        refLine.setAttribute('stroke-dashoffset', totalLen);
        refLine.style.transition = 'stroke-dashoffset 0.45s ease-out';
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){ refLine.setAttribute('stroke-dashoffset', '0'); });
        });
        refLine.addEventListener('transitionend', function(){
          refLine.style.transition = 'none';
          refLine.setAttribute('stroke-dasharray','3,2.4');
          refLine.removeAttribute('stroke-dashoffset');
        }, {once:true});
      }
      if(withHead){
        var rHeadLen = 3.6, rHeadWidth = 2.2;
        var rBackX = to.x - ux*rHeadLen, rBackY = to.y - uy*rHeadLen;
        var rPerpX = -uy, rPerpY = ux;
        var rp1x = rBackX + rPerpX*rHeadWidth, rp1y = rBackY + rPerpY*rHeadWidth;
        var rp2x = rBackX - rPerpX*rHeadWidth, rp2y = rBackY - rPerpY*rHeadWidth;
        var refHead = document.createElementNS('http://www.w3.org/2000/svg','path');
        refHead.setAttribute('d', 'M '+to.x.toFixed(2)+' '+to.y.toFixed(2)+' L '+rp1x.toFixed(2)+' '+rp1y.toFixed(2)+' L '+rp2x.toFixed(2)+' '+rp2y.toFixed(2)+' Z');
        refHead.setAttribute('fill','var(--good)');
        if(!reduceMotion){
          refHead.style.opacity = '0';
          refHead.style.transition = 'opacity 0.15s ease';
        }
        svg.appendChild(refHead);
        if(!reduceMotion){
          setTimeout(function(){ refHead.style.opacity = '1'; }, 420);
        }
      }
    }
    if(!wasCorrect){
      if(q.legs){
        // Multi-leg cut (e.g. a fake then a break): draw each leg in sequence so the
        // reference shows the actual shape, not one averaged vector.
        var legFrom = q.startPoint;
        q.legs.forEach(function(leg, i){
          var laRad = leg.angle * Math.PI/180;
          var lux = Math.cos(laRad), luy = -Math.sin(laRad);
          var legDist = Math.max(leg.minDist, leg.minDist + 4);
          var legTo = {x: legFrom.x + lux*legDist, y: legFrom.y + luy*legDist};
          drawRefSegment(legFrom, legTo, i === q.legs.length-1);
          legFrom = legTo;
        });
      } else {
        var iaRad = q.idealAngle * Math.PI/180;
        var iux = Math.cos(iaRad), iuy = -Math.sin(iaRad);
        var iEnd = {x: q.startPoint.x + iux*q.idealDist, y: q.startPoint.y + iuy*q.idealDist};
        drawRefSegment(q.startPoint, iEnd, true);
      }
    }

    var banner = document.getElementById('result-banner');
    banner.className = 'result-banner show ' + (wasCorrect ? 'good' : 'bad');
    banner.textContent = wasCorrect ? 'That\'s the right shape of cut.' : 'Not quite — the dashed line is the right cut.';
    revealIn(banner);

    finishQuestion(wasCorrect, null);
  });
}

function finishQuestion(wasCorrect, explainHtml){
  var ex = document.getElementById('explain');
  if(explainHtml){
    ex.innerHTML = '<b>'+(wasCorrect?'Yep — ':'Here\'s the read: ')+'</b>' + explainHtml;
    ex.classList.add('show');
    revealIn(ex);
  } else {
    ex.classList.remove('show');
    ex.innerHTML = '';
  }

  // If this question was already answered once (revisited via the back/next arrows),
  // replace its prior pick instead of counting it twice toward the score.
  var existing = picks.filter(function(p){ return p.q === current; })[0];
  if(existing){
    if(existing.correct && !wasCorrect) scoreCount--;
    if(!existing.correct && wasCorrect) scoreCount++;
    existing.correct = wasCorrect;
  } else {
    if(wasCorrect) scoreCount++;
    picks.push({q:current, correct:wasCorrect});
  }
  scoreChip.textContent = scoreCount + ' correct';

  var nextInline = document.getElementById('inline-next-btn');
  if(nextInline){
    nextInline.textContent = current >= Q.length - 1 ? 'See results' : 'Next';
    nextInline.classList.add('show');
    revealIn(nextInline);
  }
}

function goNext(){
  lastNavDirection = 1;
  if(current >= Q.length - 1){
    showResults();
  } else {
    current++;
    renderQuestion();
  }
}

function goPrev(){
  if(current <= 0) return;
  lastNavDirection = -1;
  current--;
  renderQuestion();
}

function showResults(){
  quizArea.style.display = 'none';
  resultsArea.style.display = 'block';
  progFill.style.width = '100%';

  var pct = Math.round(scoreCount / Q.length * 100);
  var msg;
  if(pct === 100) msg = 'Field general. You know every call cold.';
  else if(pct >= 75) msg = 'Solid. A couple calls to review before Friday.';
  else if(pct >= 50) msg = 'Getting there — spend some time with the spread plays.';
  else msg = 'Time for a playbook re-read before next practice.';

  var html = '<div class="card results">';
  html += '<h2>'+msg+'</h2>';
  html += '<div class="big-score">'+scoreCount+'<span style="font-size:28px;color:var(--ink-soft);">/'+Q.length+'</span></div>';
  html += '<p>'+pct+'% — Slow Playbook Quiz</p>';
  html += '<div class="review-list">';
  picks.forEach(function(p){
    var q = Q[p.q];
    html += '<div class="review-item '+(p.correct?'right':'wrong')+'"><span class="dot">'+(p.correct?'✓':'✗')+'</span><span>'+q.section+': '+stripHtml(q.prompt)+'</span></div>';
  });
  html += '</div>';
  html += '<button class="restart-btn" id="restart-btn">Play again</button>';
  html += '</div>';
  resultsArea.innerHTML = html;
  document.getElementById('restart-btn').addEventListener('click', restart);
}

function stripHtml(s){
  var d = document.createElement('div');
  d.innerHTML = s;
  return d.textContent;
}

function restart(){
  current = 0;
  scoreCount = 0;
  picks = [];
  quizArea.style.display = 'block';
  resultsArea.style.display = 'none';
  renderQuestion();
}

renderQuestion();
})();
</script>
